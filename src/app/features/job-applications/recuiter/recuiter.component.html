
  <h6 class="page-title" >Recuiter Details <span class="create-path ms-3" (click)="openDialog()"  matTooltip="Create new Company" >Create</span>    </h6>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

     <!-- <ng-container matColumnDef="SlNO">
    <th mat-header-cell *matHeaderCellDef> S.No </th>
    <td mat-cell *matCellDef="let element"> {{element.position}} </td>
  </ng-container> -->

   <ng-container matColumnDef="Company">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

   <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef> email </th>
    <td mat-cell *matCellDef="let element"> {{element.email}} </td>
  </ng-container>

   <ng-container matColumnDef="industry">
    <th mat-header-cell *matHeaderCellDef> phone </th>
    <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
  </ng-container>

     <ng-container matColumnDef="linkedin">
    <th mat-header-cell *matHeaderCellDef> LinkedIn </th>
    <td mat-cell *matCellDef="let element"> 
       <button  type="button" class="btn btn-primary btn-sm"
      matTooltip="Naviagte to Recuiter LinkedIn" (click)="openWebsite(element.linkedIn)"
      >
        Profile</button> 
       </td>
  </ng-container>

   <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Action</th>
    <td mat-cell *matCellDef="let element">
      <button  type="button" class="btn btn-primary btn-sm"
      matTooltip="Naviagte to  Company Website"
      >
        View</button> 
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
